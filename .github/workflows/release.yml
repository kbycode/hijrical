name: Publish to PyPI

# Publishes to PyPI automatically when you create a GitHub Release, using
# PyPI Trusted Publishing (OIDC) -- no API token or password is stored anywhere.
#
# One-time setup on PyPI (Account -> Publishing, or the project's settings):
#   Owner:            kbycode
#   Repository name:  hijrical
#   Workflow name:    release.yml
#   Environment:      (leave blank)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
